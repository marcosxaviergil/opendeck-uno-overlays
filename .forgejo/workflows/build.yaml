# Runs only when a version tag (v2.0.0) is pushed: tests, builds and publishes the plugin and its manual as that
# version's release. Tagging the same version again replaces it, so only the newest build remains.
# Pushes to branches and pull requests start nothing. No artifact is uploaded and no secret is
# needed: the release step uses the job's automatic token, which can write to this repository.
# Syntax: https://forgejo.org/docs/latest/user/actions/reference/
name: UNO Overlays - Linux plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: docker
    container:
      image: node:22-bookworm-slim
    steps:
      - name: Install build tools
        # make: make tools/lint; weasyprint + fonts: the Manual.pdf (scripts/build_manual.py); git: the Forgejo tests.
        # tests/test_ci.py checks that every command the steps and `make tools` use is in this list.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make python3 python3-pyflakes git ca-certificates \
            weasyprint fontconfig fonts-dejavu-core fonts-noto-cjk
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tools and lint (fast checks first)
        run: |
          make tools
          make lint
      - name: Test UNO behavior, WebSocket integration and the manual
        run: timeout 30m python3 -B -m unittest discover -s tests -v  # a hang fails instead of blocking the runner
      - name: Test property inspector (skipped without Playwright)
        run: node --test tests/pi/inspector.test.cjs
      - name: Build offline package for Linux x86-64 and ARM64
        run: python3 -B scripts/build.py
      - name: Build the manual (every language)
        run: timeout 20m python3 -B scripts/build_manual.py
      - name: Verify packaged entrypoint
        run: |
          dist/expanded/dev.br.consciencia.opendeck.uno-overlays.sdPlugin/launch.sh --version
          cd dist/expanded/dev.br.consciencia.opendeck.uno-overlays.sdPlugin
          sha256sum --check SHA256SUMS
      - name: Publish the release of this version
        run: python3 -B scripts/forgejo_release.py
        env:
          BUILD_COMMIT: ${{ github.sha }}
